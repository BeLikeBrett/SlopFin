name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9][0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 lld-18 make pkg-config tar unzip wget openssl libsdl2-dev libcurl4-openssl-dev

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"], p["contentId"])')
          read -r title_id content_version content_id <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          release_version=$(python3 -c 'import json; v=json.load(open("sce_sys/param.json"))["contentVersion"].split("."); print(f"{int(v[0])}.{int(v[1])*1000+int(v[2]):02d}")')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$release_version" ]]; then
            echo "Release tag must match the display version: $release_version" >&2
            exit 2
          fi
          echo "CONTENT_ID=$content_id" >> "$GITHUB_ENV"
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      - name: Lint source and metadata
        run: make lint

      - name: Run app, network and tooling tests
        run: make test

      - name: Build Linux preview
        run: make host

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      - name: Prepare optional software audio
        run: |
          make sdk-archives
          PS5_CLANG=clang-18 bash tools/build-software-audio.sh

      - name: Build and verify folder app
        run: make PS5_CLANG=clang-18 SOFTWARE_AUDIO=1

      - name: Prepare public downloads
        run: |
          mkdir -p dist/release
          (cd dist && python3 -m zipfile -c "release/SlopFin-$RELEASE_VERSION-folder.zip" "$TITLE_ID")
          cp .deps/audio/ffmpeg-9.0.1.tar.xz dist/release/ffmpeg-9.0.1-source.tar.xz
          (cd dist/release && sha256sum *.zip *.tar.xz > SHA256SUMS)

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopfin-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish downloads
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Download checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "slopfin-$GITHUB_SHA"
          --dir release

      - name: Check release files
        run: cd release && sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); v=p["contentVersion"].split("."); print(f"{int(v[0])}.{int(v[1])*1000+int(v[2]):02d}")')
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "SlopFin $release_version" \
              --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
          fi
